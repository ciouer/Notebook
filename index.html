<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hub - 个人主页</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --text-color: #333;
            --card-bg: #ffffff;
            --accent-color: #0070f3;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            box-sizing: border-box;
        }
        .profile-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            text-align: center;
        }
        .avatar {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #0070f3, #00dfd8);
            border-radius: 50%;
            margin: 0 auto 15px;
        }
        h1 {
            font-size: 24px;
            margin: 10px 0;
            font-weight: 600;
        }
        p {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .link-item {
            display: block;
            padding: 12px;
            background-color: var(--bg-color);
            color: var(--text-color);
            text-decoration: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .link-item:hover {
            background-color: var(--accent-color);
            color: white;
            transform: translateY(-2px);
        }
        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="profile-card">
        <div class="avatar"></div>
        <h1>Hello, World!</h1>
        <p>欢迎来到我的静态小站。这里主要用于托管我的一些前端学习 Demo、日常随笔以及一些常用的开源工具资源导航。</p>
        
        <div class="links">
            <a href="https://github.com" target="_blank" class="link-item">📦 我的 GitHub 仓库</a>
            <a href="https://google.com" target="_blank" class="link-item">🔍 我的前端日常记录</a>
            <a href="https://speedtest.net" target="_blank" class="link-item">⚡ 网络测速工具箱</a>
        </div>
        
        <div class="footer">
            © 2026 Crafted with ♥. Powered by Pages.
        </div>
    </div>
</div>

</body>
</html>
